packages:
  - "apps/*"
  - "packages/*"

# Windows native builds (AGP prefab, CMake, ninja) write paths such as
#   <dep>/android/build/intermediates/cxx/RelWithDebInfo/<hash>/logs/arm64-v8a/prefab_command.bat
# Inside node_modules those exceed MAX_PATH (260) and processes fail to start.
# Keeping the virtual store at the drive root keeps them short, while
# node_modules itself stays a real directory so Metro loads a single copy of
# every package (a junctioned node_modules breaks bundling).
nodeLinker: isolated
virtualStoreDir: C:/hbn/.pnpm

# One version of everything shared. Packages reference these as `catalog:` in
# devDependencies so every workspace copy resolves identically.
catalog:
  "@babel/core": ^7.28.0
  "@shopify/flash-list": ^2.3.3
  "@tamagui/config": ^3.2.1
  "@tamagui/lucide-icons": ^2.0.0-rc.26
  "@types/react": ^19.2.0
  babel-preset-expo: ~58.0.24
  expo: ~58.0.23
  expo-document-picker: ~58.0.4
  expo-file-system: ~58.0.13
  expo-status-bar: ~58.0.4
  react: 19.3.0
  react-native: 0.88.1
  react-native-builder-bob: ^0.44.1
  react-native-gesture-handler: ~3.3.0
  # Pinned exactly: 0.37.2 was published too recently for the registry policy.
  react-native-nitro-modules: 0.37.1
  react-native-reanimated: ^4.7.1
  react-native-safe-area-context: ~5.11.1
  react-native-svg: 15.16.0
  react-native-worklets: ~0.13.0
  nitrogen: 0.37.1
  tamagui: ^3.2.1
  typescript: ^6.0.0
  turbo: ^2.11.10
